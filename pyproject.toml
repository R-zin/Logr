[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logr"
version = "0.1.0"
description = "Hackathon finder and deadline tracker (Devpost, Devfolio, Unstop, Hack2skill, Luma)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.6"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<0.120", "uvicorn>=0.32", "itsdangerous>=2.2"]
dev = ["pytest>=8", "fastapi>=0.115,<0.120", "uvicorn>=0.32", "itsdangerous>=2.2"]

[project.scripts]
logr = "logr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
