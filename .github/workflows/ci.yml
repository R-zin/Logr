name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]  # oldest supported (pyproject) and current
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test (offline; network calls are mocked)
        run: python -m pytest -q

  web:
    name: Dashboard (typecheck, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: web/out
          retention-days: 3

  e2e:
    name: End-to-end (real server + dashboard in Chromium)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: web/out
      - name: Install server
        run: pip install -e '.[web]'
      - name: Install Playwright
        working-directory: web
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Seed a demo database from the test fixtures
        run: python scripts/seed_demo.py demo.db
      - name: Start logr serve
        run: |
          logr --db demo.db serve --port 8000 > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/me && exit 0; sleep 0.5; done
          cat serve.log; exit 1
      - name: Smoke test
        working-directory: web
        run: node scripts/smoke.mjs http://127.0.0.1:8000
      - name: Server log
        if: always()
        run: cat serve.log
